# Phase 8: drives the HPA past 50% so scaling is demonstrable.
#   kubectl apply -f k8s/loadtest.yaml
#   kubectl get hpa -n hello-world -w
#   kubectl delete -f k8s/loadtest.yaml     # then watch scale-down
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: hello-world
spec:
  # Bump this to push harder. 4 generators is usually enough to cross 50%
  # against a 100m CPU request.
  replicas: 4
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "while true; do wget -q -O- http://hello-world/load >/dev/null 2>&1; done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
